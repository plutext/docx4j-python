name: Publish docx4j to PyPI

# CR-007 section 4.4 and RELEASING.md, the shape of the xsdata fork's publish.yml (trusted
# publishing, no token anywhere): publishing a GitHub release builds the sdist and the wheel and
# uploads them to PyPI; running the workflow by hand (workflow_dispatch) uploads the same build to
# TestPyPI, the dry run that shows the name, the rendered readme and the wheel before the version
# is taken on PyPI. The release tag must be v plus pyproject.toml's version (v0.1.0 against
# 0.1.0), because a version once published is never reused: a mistake ships as the next patch.
#
# The trusted publishers are registered on pypi.org and test.pypi.org: project docx4j, owner
# plutext, repository docx4j-python, workflow publish.yml, no environment. Renaming this file
# breaks publishing until both settings are changed to match.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # trusted publishing's OIDC token
  contents: read

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build and twine
        run: python -m pip install --upgrade pip build twine

      - name: Check the release tag matches the version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "tag: $TAG, version: $VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match pyproject.toml's version $VERSION (expected v$VERSION)"
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Check the distributions
        run: twine check --strict dist/*

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
